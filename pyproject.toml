[project]
name = "arbolom-tool"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "clingo>=5.8.3",
    "natsort>=8.4.0",
    "pandas>=3.1.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Scripts import `aux_scripts.*` relative to the repository root.
pythonpath = ["."]
